PLG_SYSTEM_MAUTIC="System - Mautic Marketing Automation"
PLG_SYSTEM_MAUTIC_XML_DESCRIPTION="Plugin zur Integrationen von Mautic mit Joomla."
PLG_SYSTEM_MAUTIC_XML_DESCRIPTION_LONG_LABEL="<p class=\"h2 mb-4\">Mautic Marketing Integration für Joomla</p>"
PLG_SYSTEM_MAUTIC_XML_DESCRIPTION_LONG_DESC="<p class=\"h3\">Tracking</p><p>Die Tracking-Option ist direkt nachdem Sie das Plugin aktiviert, die Basis-URL eingetragen und das Plugin gespeichert haben auf der Seite aktiv.<br>Es wird ein ein JavaScript Snippet geladen, um mit Ihrer Mautic-Instanz zu kommunizieren.</p><p class=\"h3\">Formular-Einbindung</p>Um ein Formular in die Inhalte ihrer Seite einzufügen, verwenden Sie folgende Syntax: {mautic type=&#34;form&#34; ID}. Die ID ist die Kennung des Mautic-Formulars.</p>Beispiel: <code>{mautic type=&#34;form&#34; 1}</code><p class=\"h3 mt-4\">Dynamische Inhalte</p>Zum laden dynamischer Inhalte, verwenden Sie folgende Syntax:<br><br><code>{mautic type=\"content\" slot=\"slot_name\"}Standard Inhalt hier.{/mautic}</code><br><br>`slot_name` ist hierbei die Kennung des Slots, den Sie beim Hinzufügen einer \"Request dynamic content\"-Entscheidung in Ihrer Kampagne angegeben haben.</p><p class=\"h3\">Tags</p><p>Um beim Laden einer Seite Mautic-Tags an einen Kontakt anzuhängen, verwenden Sie folgenden Code:</p><code>{mautic type=\"tags\" tags=\"tag1,tag2,-removetag\"}</code><br><br><p>Sie können einen oder mehrere Tags auf bestimmten Seiten per Komma hinzufügen oder entfernen. Zum Entfernen eines Tags setzen Sie ein \"-\" vor den Tag-Namen.</p><p class=\"h3\">Fehlerbehebung und Dokumentation</p><a href=\"https://github.com/mautic/mautic-joomla#mautic-joomla-plugin\" target=\"_blank\">Zur Dokumentation</a>"
PLG_SYSTEM_MAUTIC_BASE_URL_HEADER_NOTE="<h4>Die Basis URL Ihrere Mautic Instanz ist alles was dieses Plugin benötigt um das Tracking zu aktivieren und die Einbindung von Mautic Formularen und Dynamischen Inhalten.</h4>"
